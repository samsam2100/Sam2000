<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة النظام البيئي – علوم رابع ابتدائي</title>
<style>
:root{--bg:#eaf7ee;--card:#fff;--tx:#1d3b2a;--pr:#2e9e5b;--pr2:#1f7a43;--ac:#f4a62a;--bad:#e0524d;--ok:#2e9e5b;--mut:#6b8576;--bd:#cfe6d7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10231a;--card:#183427;--tx:#e6f5ec;--pr:#3fbf74;--pr2:#2e9e5b;--mut:#9bbdab;--bd:#2a4c3a}}
:root[data-theme="dark"]{--bg:#10231a;--card:#183427;--tx:#e6f5ec;--pr:#3fbf74;--pr2:#2e9e5b;--mut:#9bbdab;--bd:#2a4c3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.7}
#app{max-width:640px;margin:0 auto;padding:12px}
.hd{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:16px;padding:12px;text-align:center;font-size:13px}
.hd b{font-size:15px;display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:12px}
h1{font-size:22px;margin:6px 0}h2{font-size:18px;margin:4px 0}
.big{font-size:44px;text-align:center}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 12px;margin:4px 0;width:100%;text-align:right}
button.p{background:var(--pr);color:#fff;border-color:var(--pr);text-align:center;font-weight:bold}
button.sel{border-color:var(--ac);background:rgba(244,166,42,.18)}
button.ok{border-color:var(--ok);background:rgba(46,158,91,.2)}
button.no{border-color:var(--bad);background:rgba(224,82,77,.18)}
input{font:inherit;width:100%;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.q{font-size:19px;font-weight:bold;margin:10px 0}
.chip{display:inline-block;background:var(--bd);border-radius:20px;padding:4px 12px;margin:3px;font-size:16px}
.fb{margin-top:8px;padding:8px;border-radius:10px;background:rgba(244,166,42,.15)}
.sm{font-size:13px;color:var(--mut)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}th,td{border:1px solid var(--bd);padding:5px;text-align:center}th{background:var(--bd)}
td input{width:60px;padding:3px}
@media print{.np{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SCH="المدرسة الابتدائية السابعة والأربعون",TCH="الأستاذة سامية الشهري",PRN="المديرة: حامدة الغامدي",PIN="1234";
const LN=["مكوّنات النظام البيئي","السلاسل الغذائية","الشبكات الغذائية","التغيّرات في النظام البيئي"],LI=["🌳","🔗","🕸️","🌪️"];
const B=[
{l:0,v:1,q:"أيّ مما يلي مكوّن حيّ في النظام البيئي؟",o:["🌵 نبات الصبار","🪨 الصخرة","💧 الماء"],a:0,h:"الكائن الحيّ ينمو ويتنفّس ويتغذّى."},
{l:0,v:1,q:"أيّ مما يلي مكوّن غير حيّ؟",o:["🐦 الطائر","☀️ ضوء الشمس","🌿 العشب"],a:1,h:"غير الحيّ لا ينمو ولا يتنفّس."},
{l:0,v:2,q:"يتكوّن النظام البيئي من:",o:["كائنات حيّة فقط","مكوّنات غير حيّة فقط","كائنات حيّة وغير حيّة تتفاعل معًا"],a:2,h:"فكّري: هل تعيش الأسماك دون ماء؟"},
{l:0,v:2,q:"الكائنات الحيّة المختلفة التي تعيش معًا في مكان واحد تُسمّى:",o:["مجتمعًا حيويًّا","صخورًا","طقسًا"],a:0,h:"كلمة «مجتمع» تعني أفرادًا يعيشون معًا."},
{l:0,v:3,q:"لماذا يُعدّ الماء مهمًّا في النظام البيئي؟",o:["تحتاجه الكائنات الحيّة لتبقى","يمنع نمو النباتات","لا علاقة له بالحياة"],a:0,h:"ماذا يحدث للنبتة إذا لم نسقِها؟"},
{l:0,v:3,q:"تختلف الصحراء عن الغابة في:",o:["وجود الكائنات الحيّة","نوع المكوّنات الحيّة وغير الحيّة فيهما","وجود الشمس"],a:1,h:"قارني بين نباتات الصحراء ونباتات الغابة."},
{l:1,v:1,q:"مصدر الطاقة الأول في السلسلة الغذائية هو:",o:["☀️ الشمس","🦁 الأسد","🦅 الصقر"],a:0,h:"النبات يحتاج ضوءًا ليصنع غذاءه."},
{l:1,v:1,q:"يُسمّى النبات منتجًا لأنه:",o:["يصنع غذاءه بنفسه","يأكل الحيوانات","لا يحتاج الضوء"],a:0,h:"المنتج = يُنتج غذاءه."},
{l:1,v:2,q:"رتّبي السلسلة الغذائية من البداية إلى النهاية:",r:["🌿 عشب","🦗 جندب","🐸 ضفدع","🐍 ثعبان"],h:"السهم يشير إلى من يأكل."},
{l:1,v:2,q:"الأرنب الذي يأكل الجزر يُسمّى:",o:["منتجًا","مستهلكًا","محلّلًا"],a:1,h:"المستهلك لا يصنع غذاءه."},
{l:1,v:3,q:"رتّبي السلسلة الغذائية:",r:["🌾 قمح","🐭 فأر","🐍 ثعبان","🦅 صقر"],h:"ابدئي بالمنتج دائمًا."},
{l:1,v:3,q:"ما دور المحلّلات كالفطريات؟",o:["تصنع الغذاء بالضوء","تُحلّل بقايا الكائنات الميتة وتُعيد المواد للتربة","تفترس الحيوانات"],a:1,h:"تنظّف النظام البيئي."},
{l:2,v:1,q:"الشبكة الغذائية هي:",o:["سلاسل غذائية متداخلة","سلسلة واحدة فقط","مجموعة صخور"],a:0,h:"شبكة = خيوط متشابكة."},
{l:2,v:1,q:"الحيوان الذي يأكل النباتات فقط يُسمّى:",o:["🐄 آكل لحوم","🐑 آكل أعشاب","🐻 آكل كل شيء"],a:1,h:"العشب = نبات."},
{l:2,v:2,q:"الإنسان يأكل النباتات والحيوانات، فهو:",o:["آكل أعشاب","آكل لحوم","آكل أعشاب ولحوم"],a:2,h:"يأكل النوعين معًا."},
{l:2,v:2,q:"لماذا تصف الشبكة الغذائية الغذاء أفضل من سلسلة واحدة؟",o:["لأن الحيوان قد يأكل أكثر من نوع","لأن الشمس تختفي","لأن النباتات لا تنمو"],a:0,h:"الصقر قد يأكل فأرًا أو أرنبًا."},
{l:2,v:3,q:"إذا قلّت الثعابين في شبكة غذائية، فماذا يحدث غالبًا للفئران؟",o:["يزداد عددها","يقلّ عددها","لا تتأثّر أبدًا"],a:0,h:"من يأكل الفئران صار أقلّ."},
{l:2,v:3,q:"الصقر يأكل الفأر والأرنب، فهو في الشبكة:",o:["منتج","مستهلك قد يتبع أكثر من سلسلة","محلّل"],a:1,h:"يظهر في أكثر من سلسلة."},
{l:3,v:1,q:"أيّ مما يلي تغيّر طبيعي في النظام البيئي؟",o:["🔥 حريق بسبب البرق","🏭 بناء مصنع","🪓 قطع الأشجار"],a:0,h:"الطبيعي يحدث دون تدخّل الإنسان."},
{l:3,v:1,q:"أيّ مما يلي تغيّر سببه الإنسان؟",o:["🌋 البركان","🪓 قطع الأشجار الجائر","🌊 الفيضان"],a:1,h:"الإنسان هو الفاعل."},
{l:3,v:2,q:"ماذا يحدث للحيوانات عند جفاف البحيرة؟",o:["تعيش كما هي","تهاجر أو يقلّ عددها","يزداد الماء"],a:1,h:"الماء ضروري للحياة."},
{l:3,v:2,q:"يضرّ التلوّث بالنظام البيئي لأنه:",o:["يضرّ بالكائنات الحيّة","يزيد الغذاء","يجعل الجوّ أجمل"],a:0,h:"فكّري في سمكة في ماء ملوّث."},
{l:3,v:3,q:"أيّ تصرّف يحافظ على النظام البيئي؟",o:["رمي النفايات في البحر","إعادة التدوير وزراعة الأشجار","صيد الحيوانات النادرة"],a:1,h:"اختاري ما يحمي الكائنات."},
{l:3,v:3,q:"إدخال حيوان غريب إلى نظام بيئي قد:",o:["يُخلّ بالتوازن بين الكائنات","لا يغيّر شيئًا","يزيد الماء"],a:0,h:"الكائنات الأصلية قد تفقد غذاءها."}];
const ACT=[["ارسمي نظامًا بيئيًّا صغيرًا ولوّني الحيّ بالأخضر وغير الحيّ بالأزرق.","اشرحي لزميلتك بصوتك: ما الحيّ وما غير الحيّ؟","قومي بجولة في الفصل وأشيري إلى 3 أشياء حيّة و3 غير حيّة."],
["ارسمي سلسلة غذائية بالأسهم من 4 كائنات.","غنّي أو رتّلي أسماء السلسلة بالترتيب.","شاركي في تمثيل السلسلة: كل طالبة كائن وتمسك بيد التي بعدها."],
["لوّني شبكة غذائية بألوان مختلفة لكل سلسلة.","اشرحي شفهيًّا كيف تتصل سلسلتان.","ركّبي شبكة بخيط وبطاقات صور على اللوح."],
["ارسمي مشهدًا قبل التغيّر وبعده.","ناقشي مع زميلتك: كيف نحمي بيئتنا؟","مثّلي دور حارسة البيئة وانقلي رسالة للصف."]];
const ENR=["صمّمي شبكة غذائية لبيئة صحراوية في المملكة بـ 6 كائنات على الأقل.","اكتبي توقّعًا: ماذا يحدث لو اختفى كائن واحد من الشبكة؟ ولماذا؟","اصنعي ملصقًا يدعو للحفاظ على البيئة وقدّميه للصف."];
const REM=["صنّفي 10 صور إلى حيّ وغير حيّ بالبطاقات.","ركّبي سلسلة من 3 كائنات تبدأ بالشمس والنبات.","ارسمي أسهمًا بين كائنات من سلسلتين لتكوّني شبكة.","اذكري تغيّرًا واحدًا وأثره على الكائنات."];
let S={},app=document.getElementById("app"),mem=[];
const hd=()=>`<div class="hd"><b>🌍 مغامرة النظام البيئي – علوم رابع ابتدائي – الفصل الأول</b>${SCH}<br>${TCH} • ${PRN}</div>`;
const rd=()=>{try{return JSON.parse(localStorage.getItem("eco4")||"[]")}catch(e){return mem}};
const wr=a=>{mem=a;try{localStorage.setItem("eco4",JSON.stringify(a))}catch(e){}};
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";speechSynthesis.speak(u)}catch(e){}};
function home(){S={n:"",lv:1,st:0,li:0,sc:[0,0,0,0],pts:0};
app.innerHTML=hd()+`<div class="card"><div class="big">🦎🌵🦅</div><h1>أهلًا بالمستكشفات الصغيرات!</h1>
<p class="sm">أجيبي عن أسئلة 4 محطات، اجمعي النجوم، وفي النهاية تعرفين خطتك.</p>
<input id="nm" placeholder="اكتبي اسمك هنا">
<h2>اختاري مستواك</h2><div id="lvs"></div><h2>كيف تحبين أن تتعلمي؟</h2><div id="sts"></div>
<button class="p" onclick="go()">ابدئي المغامرة 🚀</button><button onclick="tpin()" class="np">🔒 لوحة المعلمة</button></div>`;
pick("lvs",["🌱 مبتدئة (أحتاج مساعدة)","🌿 متوسطة","🌳 متقدمة (أحب التحدي)"],"lv",1);
pick("sts",["👁️ بصري: أحب الصور","🎧 سمعي: أحب الاستماع","✋ حركي: أحب العمل بيدي"],"st",0)}
function pick(id,a,k,o){const e=document.getElementById(id);e.innerHTML=a.map((t,i)=>`<button class="${S[k]==i+o?"sel":""}" onclick="S.${k}=${i+o};pick('${id}',${JSON.stringify(a).replace(/"/g,"&quot;")},'${k}',${o})">${t}</button>`).join("")}
function go(){S.n=document.getElementById("nm").value.trim();if(!S.n){alert("اكتبي اسمك أولًا");return}S.lvl=S.lv;startL()}
function startL(){S.qi=0;S.used=[];nextQ()}
function nextQ(){if(S.qi>=5)return endL();
let p=B.filter(x=>x.l==S.li&&!S.used.includes(x));
let c=p.filter(x=>x.v==S.lvl);if(!c.length)c=p.sort((a,b)=>Math.abs(a.v-S.lvl)-Math.abs(b.v-S.lvl)).slice(0,1);
S.q=sh(c)[0];S.used.push(S.q);S.hint=0;S.done=0;S.seq=[];show()}
function show(){const q=S.q;
let h=hd()+`<div class="card"><div class="top"><span>${LI[S.li]} المحطة ${S.li+1}: ${LN[S.li]}</span><span>⭐ ${S.pts}</span></div><div class="bar"><i style="width:${S.qi*20}%"></i></div>
<div class="sm">سؤال ${S.qi+1} من 5 • المستوى ${["🌱","🌿","🌳"][q.v-1]}</div><div class="q">${q.q} <button style="width:auto;display:inline" onclick="say(S.q.q)">🔊</button></div>`;
if(q.r){if(!S.pool)S.pool=0;S.pl=S.pl&&S.plq===q?S.pl:sh(q.r);S.plq=q;
h+=`<div>${S.seq.map((x,i)=>`<span class="chip">${i+1}. ${x}</span>`).join("")||'<span class="sm">اضغطي على البطاقات بالترتيب الصحيح</span>'}</div><div>${S.pl.filter(x=>!S.seq.includes(x)).map(x=>`<button onclick="ord('${x}')">${x}</button>`).join("")}</div><button onclick="S.seq=[];show()">↩️ إعادة الترتيب</button>`}
else{S.op=S.opq===q?S.op:sh(q.o.map((t,i)=>[t,i==q.a]));S.opq=q;h+=S.op.map((x,i)=>`<button id="o${i}" onclick="ans(${i})">${x[0]}</button>`).join("")}
h+=`<button onclick="hint()" class="np">💡 تلميح (نصف النقاط)</button><div id="fb"></div><div id="nx"></div></div>`;app.innerHTML=h;
if(S.st==1)say(q.q);if(S.hint)hint(1)}
function hint(r){S.hint=1;document.getElementById("fb").innerHTML=`<div class="fb">💡 ${S.q.h}${S.st==0?" 👀":""}</div>`}
function fin(ok){if(S.done)return;S.done=1;const g=ok?(S.hint?5:10):0;S.pts+=g;if(ok)S.sc[S.li]++;
S.lvl=Math.max(1,Math.min(3,S.lvl+(ok?1:-1)));S.qi++;
document.getElementById("fb").innerHTML=`<div class="fb">${ok?"🎉 أحسنتِ! +"+g:"🌱 لا بأس، حاولي في السؤال القادم"}</div>`;
document.getElementById("nx").innerHTML=`<button class="p" onclick="nextQ()">التالي ➡️</button>`}
function ans(i){if(S.done)return;const ok=S.op[i][1];document.getElementById("o"+i).className=ok?"ok":"no";S.op.forEach((x,j)=>{if(x[1])document.getElementById("o"+j).className="ok"});fin(ok)}
function ord(x){if(S.done)return;S.seq.push(x);if(S.seq.length<S.q.r.length){show();return}
const ok=S.seq.join()==S.q.r.join();show();S.done=0;fin(ok);if(!ok)document.getElementById("fb").innerHTML+=`<div class="fb">الترتيب الصحيح: ${S.q.r.join(" ← ")}</div>`}
function endL(){const s=S.sc[S.li];
app.innerHTML=hd()+`<div class="card"><div class="big">${"⭐".repeat(s)||"🌱"}</div><h2>أنهيتِ محطة ${LN[S.li]}</h2><p>نتيجتك: ${s} من 5</p>
<div class="fb"><b>نشاط يناسب أسلوبك:</b><br>${ACT[S.li][S.st]}</div>
<button class="p" onclick="${S.li<3?"S.li++;startL()":"final()"}">${S.li<3?"المحطة التالية ➡️":"اعرفي خطتك 🏆"}</button></div>`}
function final(){const t=S.sc.reduce((a,b)=>a+b,0),enr=t>=15;const weak=S.sc.map((x,i)=>x<3?i:-1).filter(i=>i>=0);
const r=rd();r.push({n:S.n,d:new Date().toLocaleDateString("ar-SA"),s:S.sc.slice(),t,p:enr?"إثرائي":"علاجي",m:""});wr(r);
app.innerHTML=hd()+`<div class="card"><div class="big">${enr?"🏆":"🌟"}</div><h1>أحسنتِ يا ${S.n}!</h1><p>مجموعك: <b>${t} / 20</b> • نقاط اللعب: ${S.pts}</p>
${S.sc.map((x,i)=>`<div class="sm">${LI[i]} ${LN[i]}: ${x}/5</div><div class="bar"><i style="width:${x*20}%"></i></div>`).join("")}
<h2>${enr?"🚀 مسارك: إثرائي":"🧩 مسارك: علاجي"}</h2><div class="fb">${enr?ENR.map(x=>"• "+x).join("<br>"):(weak.length?weak:[0,1,2,3]).map(i=>`• ${LN[i]}: ${REM[i]}`).join("<br>")+"<br>• أعيدي اللعب بمستوى مبتدئ، وستتحسّنين."}</div>
<p class="sm">تم حفظ نتيجتك للأستاذة ${TCH.replace("الأستاذة ","")}.</p><button class="p" onclick="home()">لعب من جديد 🔁</button></div>`}
function tpin(){if(prompt("أدخلي الرقم السري للمعلمة")===PIN)dash();else alert("الرقم غير صحيح")}
function dash(){const r=rd(),av=r.length?(r.reduce((a,b)=>a+b.t,0)/r.length).toFixed(1):0,en=r.filter(x=>x.p=="إثرائي").length;
app.innerHTML=hd()+`<div class="card"><h2>📊 لوحة المعلمة لرصد الدرجات</h2>
<div class="row"><div class="chip">الطالبات: ${r.length}</div><div class="chip">المتوسط: ${av}/20</div><div class="chip">إثرائي: ${en}</div><div class="chip">علاجي: ${r.length-en}</div></div>
<div class="tw"><table><tr><th>الاسم</th><th>التاريخ</th>${LN.map((x,i)=>`<th>${LI[i]}</th>`).join("")}<th>المجموع/20</th><th>المسار</th><th>درجة المعلمة</th></tr>
${r.map((x,i)=>`<tr><td>${x.n}</td><td>${x.d}</td>${x.s.map(v=>`<td>${v}</td>`).join("")}<td><b>${x.t}</b></td><td>${x.p}</td><td><input value="${x.m||""}" onchange="up(${i},this.value)"></td></tr>`).join("")||'<tr><td colspan="9">لا توجد نتائج بعد</td></tr>'}</table></div>
<p class="sm">النتائج تُحفظ على هذا الجهاز؛ شغّلي اللعبة على جهاز الصف لتجتمع النتائج هنا.</p>
